apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopua-app
  labels:
    app: shopua
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopua
  template:
    metadata:
      labels:
        app: shopua
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: shopua
          image: ghcr.io/mdobrianskyy/devops-claude-test:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5050
          envFrom:
            - configMapRef:
                name: shopua-config
            - secretRef:
                name: shopua-secret
          readinessProbe:
            httpGet:
              path: /
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5050
            initialDelaySeconds: 15
            periodSeconds: 20
